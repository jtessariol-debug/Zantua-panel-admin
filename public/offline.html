<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12382F" />
    <title>Zantua | Sin conexión</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: #f8f3ea;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1b1b1b;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #fffdf8;
        border: 1px solid #e7dccb;
        border-radius: 24px;
        box-shadow: 0 18px 36px rgba(18, 56, 47, 0.08);
        padding: 28px;
        text-align: center;
      }

      .logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        color: #12382f;
      }

      p {
        margin: 12px 0 0;
        color: #6f6258;
        line-height: 1.6;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/apple-touch-icon.png" alt="Zantua Aesthetic Wellness" />
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Verifica tu conexión para usar el sistema.</p>
    </main>
  </body>
</html>
